name: Nexus QA

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Static QA agent
        run: npm run qa
      - name: Lint
        run: npx eslint . --rule 'prettier/prettier: off'
      - name: Production build
        run: npm run build
